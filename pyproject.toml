[project]
name = "qif-micro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luigi D. C. Soares", email = "dev@luigidcsoares.com" }
]
requires-python = ">=3.13"
dependencies = [
    "multimethod>=2.0.2",
    "polars>=1.32.3",
    "scipy>=1.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "catppuccin-jupyterlab>=0.2.4",
    "jedi-language-server>=0.46.0",
    "jupyter>=1.1.1",
    "pytest>=8.4.1",
    "python-lsp-server>=1.14.0",
    "ruff>=0.15.10",
    "ty>=0.0.29",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

[tool.ruff.lint]
ignore = ["E701"]
