[project]
name = "qif-micro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{name = "Luigi D. C. Soares", email = "dev@luigidcsoares.com"}]
requires-python = ">=3.13"

dependencies = [
    "multimethod>=2.0.2",
    "polars>=1.32.3",
    "scipy>=1.16.3"
]

[project.optional-dependencies]
# Let users install qif-micro[rtcompat]
rtcompat = ["polars[rtcompat]>=1.32.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qif_micro", "experiments/benchmark"]

[dependency-groups]
dev = [
    "altair>=6.1.0",
    "catppuccin-jupyterlab>=0.2.4",
    "jedi-language-server>=0.46.0",
    "jupyter>=1.1.1",
    "loky>=3.5.6",
    "pytest>=8.4.1",
    "python-lsp-server>=1.14.0",
    "ruff>=0.15.10",
    "tqdm>=4.67.3",
    "ty>=0.0.29",
    "vl-convert-python>=1.9.0.post1",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

[tool.ruff.lint]
ignore = ["E701"]
